name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: Lint, PHPCS, PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer check-versions
      - run: composer phpcs
      - run: composer phpstan

  php-unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Officially supported PHP versions (docs/REQUIREMENTS.md). Newer versions are not declared until tested.
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test

  integration:
    name: Integration (WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: [ '6.4', 'latest' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - run: npm ci
      - name: Pin WordPress version
        if: matrix.wp != 'latest'
        # Current WooCommerce requires a newer WordPress, so the pinned old version runs without it.
        run: echo '{"core":"WordPress/WordPress#${{ matrix.wp }}","plugins":[]}' > .wp-env.override.json
      - run: npm run env:start
      - run: npm run test:php:integration
      - run: npm run test:php:multisite
      - name: Integration with WooCommerce active
        if: matrix.wp == 'latest'
        run: npm run test:php:woo
      # wp-env runs PHP 8.3; the minimum supported PHP gets its own full run (see bin/test-integration-php.sh).
      - name: Integration on minimum PHP 7.4 (single-site, multisite)
        run: |
          bin/test-integration-php.sh 7.4 single
          bin/test-integration-php.sh 7.4 multisite
      - name: Integration on minimum PHP 7.4 with WooCommerce active
        if: matrix.wp == 'latest'
        run: bin/test-integration-php.sh 7.4 woo

  js:
    name: JS lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run test:js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/

  package:
    name: Package + Plugin Check
    needs: [ php-quality, php-unit, js ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/
      - name: Build distributable directory
        run: |
          mkdir -p dist/dumpseo
          rsync -a --exclude-from=.distignore ./ dist/dumpseo/
          (cd dist && zip -qr dumpseo.zip dumpseo)
          unzip -l dist/dumpseo.zip
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/dumpseo
      - uses: actions/upload-artifact@v4
        with:
          name: dumpseo-zip
          path: dist/dumpseo.zip
